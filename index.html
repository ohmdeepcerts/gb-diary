<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#E1251B">
<title>GB Diary</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root { --red: #E1251B; --red-dark: #b81c14; }

  body[data-theme="dark"] {
    --bg: #0f0f0f; --bg2: #1a1a1a; --bg3: #252525; --bg4: #2f2f2f;
    --border: #333; --text: #f0f0f0; --text2: #aaa; --text3: #666;
    --today-bg: rgba(225,37,27,0.10); --shadow: 0 1px 4px rgba(0,0,0,0.4);
  }
  body[data-theme="light"] {
    --bg: #f0f2f5; --bg2: #ffffff; --bg3: #f5f5f5; --bg4: #e8e8e8;
    --border: #e0e0e0; --text: #111; --text2: #555; --text3: #999;
    --today-bg: rgba(225,37,27,0.06); --shadow: 0 1px 4px rgba(0,0,0,0.08);
  }

  body {
    width: 100vw; height: 100dvh;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px; overflow: hidden;
  }
  @media (max-width: 700px) {
    body { font-size: 12px; }
    .week-grid { overflow-x: auto; }
    .app-header { padding: 6px 8px; gap: 4px; }
    .hdr-logo { font-size: 14px; }
    .vbtn { padding: 5px 8px; font-size: 10px; }
    .login-box { width: 90vw; padding: 24px 20px; }
  }

  /* ── VIEWS ── */
  .view { display: none; flex-direction: column; height: 100vh; }
  .view.active { display: flex; }

  /* ── LOGIN ── */
  #view-login { align-items: center; justify-content: center; gap: 20px; }
  .login-logo { color: var(--red); font-size: 26px; font-weight: 800; letter-spacing: -1px; }
  .login-logo span { color: var(--text2); font-weight: 400; font-size: 14px; margin-left: 8px; }
  .login-box {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
    padding: 32px 36px; width: 320px; display: flex; flex-direction: column; gap: 16px;
    box-shadow: var(--shadow);
  }
  .fl { font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 5px; }
  .inp {
    width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); padding: 9px 11px; font-size: 13px; outline: none;
    transition: border 0.15s; font-family: inherit;
  }
  .inp:focus { border-color: var(--red); }
  select.inp option { background: var(--bg3); color: var(--text); }

  /* ── SHARED HEADER ── */
  .app-header {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; background: var(--bg2); border-bottom: 1px solid var(--border);
    flex-shrink: 0; user-select: none;
  }
  .hdr-logo { color: var(--red); font-weight: 800; font-size: 17px; margin-right: 4px; letter-spacing: -1px; }

  .view-switch { display: flex; background: var(--bg3); border-radius: 6px; padding: 2px; border: 1px solid var(--border); }
  .vbtn {
    background: none; border: none; color: var(--text2); border-radius: 4px;
    padding: 5px 14px; font-size: 11px; font-weight: 700; cursor: pointer;
    text-transform: uppercase; letter-spacing: 0.4px; transition: all 0.15s;
  }
  .vbtn.active { background: var(--red); color: #fff; }
  .vbtn:not(.active):hover { background: var(--bg4); color: var(--text); }

  .nav-btn {
    background: var(--bg3); border: 1px solid var(--border); color: var(--text);
    border-radius: 5px; padding: 5px 11px; cursor: pointer; font-size: 15px; line-height: 1;
  }
  .nav-btn:hover { background: var(--bg4); }
  .date-label { font-size: 13px; font-weight: 700; min-width: 170px; text-align: center; }

  .spacer { flex: 1; }

  .btn-today {
    background: none; border: 1px solid var(--border); color: var(--text2);
    border-radius: 5px; padding: 5px 12px; cursor: pointer; font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.3px; transition: all 0.1s;
  }
  .btn-today:hover { border-color: var(--red); color: var(--red); }

  .btn-icon {
    background: var(--bg3); border: 1px solid var(--border); color: var(--text2);
    border-radius: 5px; padding: 5px 9px; cursor: pointer; font-size: 13px; line-height: 1;
  }
  .btn-icon:hover { background: var(--bg4); color: var(--text); }
  .btn-add {
    background: var(--red); color: #fff; border: none; border-radius: 5px;
    padding: 6px 14px; font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .btn-add:hover { background: var(--red-dark); }

  /* ── STATUS BAR ── */
  .status-bar {
    padding: 4px 12px; border-top: 1px solid var(--border);
    background: var(--bg2); display: flex; align-items: center; gap: 8px;
    font-size: 10px; color: var(--text3); flex-shrink: 0;
  }
  /* Live indicator */
  .live-dot {
    display: none; width: 7px; height: 7px; border-radius: 50%;
    background: #22C55E; flex-shrink: 0;
    animation: livepulse 2s ease-in-out infinite;
  }
  @keyframes livepulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.45; transform: scale(0.75); }
  }
  .live-label { color: #22C55E; font-weight: 700; font-size: 10px; }
  .live-cd    { color: var(--text3); font-size: 10px; }
  .sdot { width: 6px; height: 6px; border-radius: 50%; background: #22C55E; }
  .sdot.err { background: #f87171; }

  /* ── LOADING ── */
  .loading-row {
    display: flex; align-items: center; justify-content: center;
    height: 200px; color: var(--text3); font-size: 13px; gap: 10px;
    flex-direction: column;
  }
  .spinner {
    width: 20px; height: 20px; border: 2px solid var(--border);
    border-top-color: var(--red); border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ────────────────────────────────────────
     WEEK VIEW
  ──────────────────────────────────────── */
  #view-week .body { flex: 1; overflow: auto; }

  .diary-grid { display: grid; }

  .eng-corner {
    background: var(--bg2); position: sticky; left: 0; top: 0; z-index: 15;
    border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
    padding: 6px 10px; font-size: 10px; color: var(--text3);
    display: flex; align-items: center; justify-content: space-between;
  }

  .day-hdr {
    background: var(--bg2); padding: 8px 6px; border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10;
    text-align: center; cursor: pointer; transition: background 0.1s;
  }
  .day-hdr:hover { background: var(--bg3); }
  .dh-name { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text3); }
  .dh-num  { font-size: 22px; font-weight: 800; line-height: 1.1; color: var(--text); }
  .dh-mon  { font-size: 10px; color: var(--text3); }
  .day-hdr.today-hdr .dh-num  { color: var(--red); }
  .day-hdr.today-hdr .dh-name { color: var(--red); }

  .eng-hdr {
    background: var(--bg2); padding: 8px 10px; border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border); position: sticky; left: 0; z-index: 5;
    font-size: 12px; font-weight: 700; white-space: nowrap;
    display: flex; align-items: center; gap: 6px;
  }
  .eng-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .eng-hdr.unassigned { color: var(--text3); }

  .grid-cell {
    border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
    padding: 4px; min-height: 72px; vertical-align: top;
  }
  .grid-cell.drag-over { background: rgba(225,37,27,0.08) !important; outline: 2px dashed var(--red); outline-offset: -2px; }
  .grid-cell.today-col { background: var(--today-bg); }

  /* ── JOB CARDS (week) ── */
  .job-card {
    background: var(--bg3); border: 1px solid var(--border); border-radius: 5px;
    padding: 5px 7px; margin-bottom: 4px; cursor: grab; border-left: 3px solid #888;
    transition: box-shadow 0.1s; overflow: hidden;
  }
  .job-card:hover { box-shadow: var(--shadow); }
  .job-card.dragging { opacity: 0.3; }
  .jc-title { font-size: 11px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .jc-addr  { font-size: 10px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .jc-meta  { display: flex; gap: 3px; align-items: center; margin-top: 3px; flex-wrap: wrap; }
  .jbadge { font-size: 9px; padding: 1px 5px; border-radius: 3px; font-weight: 700; white-space: nowrap; }
  .jtime  { font-size: 9px; color: var(--text2); }
  .jref   { font-size: 9px; color: var(--text3); margin-left: auto; }

  /* ────────────────────────────────────────
     DAY VIEW — compact table (like portal jobs page)
  ──────────────────────────────────────── */
  #view-day .body { flex: 1; overflow: hidden; display: flex; flex-direction: row; }
  .day-table-area { flex: 1; overflow-y: auto; padding: 12px 16px 20px; min-width: 0; }

  .day-table-wrap {
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg2); overflow: auto;
    box-shadow: var(--shadow);
  }
  table.day-table {
    border-collapse: separate; border-spacing: 0;
    width: 100%; min-width: 900px; table-layout: fixed;
  }
  .day-table thead th {
    position: sticky; top: 0; z-index: 2;
    background: var(--bg3); border-bottom: 1px solid var(--border);
    color: var(--text2); font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.025em; text-align: left; font-weight: 700;
    padding: 8px 8px; white-space: nowrap;
  }
  .day-table tbody td {
    height: 38px; padding: 5px 8px; border-bottom: 1px solid var(--border);
    vertical-align: middle; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    color: var(--text); font-size: 12px;
  }
  .day-table tbody tr:last-child td { border-bottom: 0; }
  .day-table tbody tr { cursor: pointer; }
  .day-table tbody tr:hover td { background: var(--today-bg) !important; }

  /* Row tint by job type */
  .day-table tr.drow-cert td       { background: rgba(5,150,105,0.05); }
  .day-table tr.drow-repair td     { background: rgba(220,38,38,0.04); }
  .day-table tr.drow-urgent td     { background: rgba(217,119,6,0.06); }
  .day-table tr.drow-emergency td  { background: rgba(217,119,6,0.09); }

  /* Group header row */
  .day-table tr.dgroup td {
    height: 28px; background: var(--bg3) !important;
    border-bottom: 1px solid var(--border); font-weight: 700;
    color: var(--text2); font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.5px; padding: 4px 8px;
  }

  /* Type pill */
  .dtype-pill {
    display: inline-flex; align-items: center; border-radius: 10px;
    padding: 2px 6px; font-size: 9px; font-weight: 700; line-height: 1.3;
    margin-left: 4px; vertical-align: middle;
  }
  .dtype-cert  { background: rgba(5,150,105,0.15); color: #047857; }
  .dtype-repair{ background: rgba(220,38,38,0.12);  color: #b91c1c; }
  .dtype-urgent{ background: rgba(217,119,6,0.15);  color: #b45309; }
  .dtype-emerg { background: rgba(217,119,6,0.22);  color: #92400e; }
  .dtype-norm  { background: rgba(37,99,235,0.10);  color: #1d4ed8; }

  .djob-ref { font-size: 10px; color: var(--text3); font-family: monospace; }
  .djob-title { font-size: 10px; margin-top: 2px; color: var(--text1); font-weight: 600; line-height: 1.2; }
  .deng-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .day-act-btn {
    width: 24px; height: 24px; border: 1px solid var(--border);
    background: transparent; color: var(--text2); border-radius: 5px;
    cursor: pointer; font-size: 13px; display: inline-grid; place-items: center;
  }
  .day-act-btn:hover { background: var(--bg3); color: var(--red); }
  .day-wa-btn {
    width: 26px; height: 24px; border: 1px solid rgba(37,211,102,.4);
    background: rgba(37,211,102,.08); color: #18a44a; border-radius: 5px;
    cursor: pointer; font-size: 13px; display: inline-grid; place-items: center;
  }
  .day-wa-btn:hover { background: rgba(37,211,102,.2); }
  .day-act-wrap { display: flex; gap: 3px; align-items: center; flex-wrap: wrap; }
  .day-tel-link {
    color: var(--text2); text-decoration: none; font-size: 11px;
    display: inline-flex; align-items: center; gap: 3px;
  }
  .day-tel-link:hover { color: var(--red); text-decoration: underline; }
  .day-empty { color: var(--text3); font-size: 13px; text-align: center; padding: 40px; }

  /* ── Row stamps (Confirmed, Invoice, Paid, etc.) ── */
  .row-stamps { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 3px; }
  .row-stamp {
    display: inline-block; padding: 1px 5px; border-radius: 3px;
    font-size: 9px; font-weight: 700; line-height: 1.5; white-space: nowrap;
  }
  .stamp-ok     { background: rgba(5,150,105,0.12);  color: #047857; }
  .stamp-warn   { background: rgba(217,119,6,0.12);  color: #b45309; }
  .stamp-inv    { background: rgba(37,99,235,0.10);  color: #1d4ed8; }
  .stamp-unpaid { background: rgba(220,38,38,0.10);  color: #b91c1c; }
  .stamp-muted  { background: var(--bg4);            color: var(--text3); }
  .stamp-ref    { background: rgba(124,58,237,0.10); color: #7c3aed; }
  .stamp-toggle { cursor: pointer; user-select: none; }
  .stamp-toggle:hover { filter: brightness(1.15); outline: 1px solid currentColor; outline-offset: 1px; }
  .stamp-tagged { background: rgba(139,92,246,.15); color: #7c3aed; font-weight: 700; }
  body[data-theme="light"] .stamp-tagged { background: rgba(139,92,246,.12); }

  /* ── JOB DETAIL MODAL ── */
  #jd-overlay {
    display: none; position: fixed; inset: 0; z-index: 2000;
    background: rgba(0,0,0,0.65); overflow-y: auto; padding: 24px 16px;
    align-items: flex-start; justify-content: center;
  }
  #jd-overlay.jd-open { display: flex; }
  #jd-modal {
    background: var(--bg2); border-radius: 12px; width: 100%; max-width: 920px;
    overflow: hidden; box-shadow: 0 24px 80px rgba(0,0,0,0.5);
    margin: auto; position: relative;
  }
  .jd-hdr {
    display: flex; align-items: flex-start; justify-content: space-between;
    padding: 16px 20px 14px; border-bottom: 1px solid var(--border); background: var(--bg3);
  }
  .jd-hdr-left { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }
  .jd-ref { font-size: 11px; color: var(--text3); font-family: monospace; }
  .jd-hdr h2 { margin: 0; font-size: 18px; color: var(--text); font-weight: 700; }
  .jd-hdr-btns { display: flex; gap: 8px; align-items: flex-start; flex-shrink: 0; margin-left: 12px; }
  #jd-close { background: none; border: 1px solid var(--border); color: var(--text2); cursor: pointer; font-size: 16px; padding: 4px 10px; border-radius: 6px; line-height: 1; }
  #jd-close:hover { color: var(--text); background: var(--bg4); }
  .jd-body { padding: 16px 20px 24px; }
  .jd-info-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
    gap: 8px 16px; margin-bottom: 16px; padding: 12px 14px;
    background: var(--bg3); border-radius: 8px; border: 1px solid var(--border);
  }
  .jd-info-item { display: flex; flex-direction: column; gap: 2px; }
  .jd-info-label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text3); font-weight: 700; }
  .jd-info-val { color: var(--text); font-weight: 500; font-size: 12px; word-break: break-word; }
  .jd-section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text3); margin: 18px 0 8px; }
  .jd-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
  .jd-btn {
    padding: 7px 14px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg3); color: var(--text); font-size: 12px; font-weight: 600;
    cursor: pointer; transition: background 0.12s; text-decoration: none; display: inline-block;
  }
  .jd-btn:hover { background: var(--bg4); }
  .jd-btn:disabled { opacity: 0.5; cursor: default; }
  .jd-btn-danger  { background: rgba(239,68,68,.1);  color: #ef4444; border-color: rgba(239,68,68,.3); }
  .jd-btn-danger:hover  { background: rgba(239,68,68,.2); }
  .jd-btn-success { background: rgba(34,197,94,.1);  color: #16a34a; border-color: rgba(34,197,94,.3); }
  .jd-btn-success:hover { background: rgba(34,197,94,.2); }
  .jd-btn-primary { background: rgba(59,130,246,.12); color: #2563eb; border-color: rgba(59,130,246,.3); }
  .jd-btn-primary:hover { background: rgba(59,130,246,.22); }
  .jd-btn-wa { background: rgba(37,211,102,.1); color: #16a34a; border-color: rgba(37,211,102,.35); }
  .jd-btn-wa:hover { background: rgba(37,211,102,.2); }

  /* QB: quote switcher tabs */
  .qb-quote-tabs { display:flex; gap:4px; padding:8px 0 0; border-bottom:1px solid var(--border); margin-bottom:8px; }
  .qb-quote-tab { background:none; border:none; border-bottom:2px solid transparent; padding:4px 12px; font-size:12px; color:var(--text2); cursor:pointer; border-radius:3px 3px 0 0; }
  .qb-quote-tab:hover { background:var(--bg3); }
  .qb-quote-tab.active { color:var(--text); font-weight:600; background:var(--bg3); }

  /* QB: approval status pills */
  .qb-status-pill { display:inline-block; font-size:10px; font-weight:700; padding:1px 7px; border-radius:3px; vertical-align:middle; margin-left:4px; }
  .qb-status-pending  { background:rgba(245,158,11,.15); color:#F59E0B; border:1px solid rgba(245,158,11,.35); }
  .qb-status-approved { background:rgba(22,163,74,.15);  color:#16a34a; border:1px solid rgba(22,163,74,.35); }
  .qb-status-declined { background:rgba(239,68,68,.15);  color:#ef4444; border:1px solid rgba(239,68,68,.35); }

  /* Contact search in Add Job */
  .contact-search-wrap { position:relative; }
  .contact-dropdown { position:absolute; top:100%; left:0; right:0; background:var(--bg2); border:1px solid var(--border); border-radius:6px; box-shadow:var(--shadow); z-index:500; max-height:220px; overflow-y:auto; }
  .contact-drop-item { padding:8px 12px; cursor:pointer; border-bottom:1px solid var(--border); }
  .contact-drop-item:last-child { border-bottom:none; }
  .contact-drop-item:hover { background:var(--bg3); }
  .contact-drop-item strong { display:block; font-size:12px; color:var(--text); }
  .contact-drop-item span { font-size:11px; color:var(--text2); }
  .contact-drop-empty { padding:10px 12px; font-size:12px; color:var(--text3); }

  /* Month view daily stats */
  .month-day-stats { display:flex; justify-content:space-between; font-size:9px; color:var(--text3); padding:1px 0 2px; }

  /* Global search */
  .gsearch-box { background:var(--bg2); border:1px solid var(--border); border-radius:12px; width:680px; max-width:96vw; box-shadow:0 8px 32px rgba(0,0,0,.35); display:flex; flex-direction:column; max-height:70vh; overflow:hidden; }
  .gsearch-hdr { display:flex; align-items:center; gap:8px; padding:12px 14px; border-bottom:1px solid var(--border); }
  .gsearch-results { overflow-y:auto; padding:6px 0; }
  .gsearch-hint { padding:16px 18px; font-size:12px; color:var(--text3); text-align:center; }
  .gsearch-result { display:flex; align-items:center; gap:10px; padding:9px 16px; cursor:pointer; }
  .gsearch-result:hover { background:var(--bg3); }
  .gsearch-dot { flex-shrink:0; width:8px; height:8px; border-radius:50%; }
  .gsearch-info { flex:1; min-width:0; }
  .gsearch-title { font-size:13px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .gsearch-ref { font-size:10px; font-weight:400; color:var(--text3); margin-left:6px; }
  .gsearch-sub { font-size:11px; color:var(--text2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .gsearch-badge { font-size:10px; font-weight:600; padding:2px 7px; border-radius:3px; white-space:nowrap; }
  .jd-photos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
  .jd-photo { border-radius: 6px; overflow: hidden; border: 1px solid var(--border); cursor: pointer; }
  .jd-photo img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; transition: opacity .15s; }
  .jd-photo img:hover { opacity: 0.85; }
  .jd-photo-label { font-size: 9px; color: var(--text3); text-align: center; padding: 3px 4px; background: var(--bg3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .jd-events-list { display: flex; flex-direction: column; gap: 4px; max-height: 320px; overflow-y: auto; }
  .jd-event { display: flex; gap: 8px; align-items: flex-start; font-size: 11px; padding: 6px 8px; border-radius: 5px; background: var(--bg3); }
  .jd-event-icon { flex-shrink: 0; width: 18px; text-align: center; }
  .jd-event-body { flex: 1; min-width: 0; }
  .jd-event-actor { font-weight: 700; color: var(--text); }
  .jd-event-msg { color: var(--text2); margin-top: 1px; word-break: break-word; }
  .jd-event-time { flex-shrink: 0; color: var(--text3); font-size: 10px; white-space: nowrap; }
  .jd-spinner { text-align: center; padding: 48px; color: var(--text3); display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 14px; }


  /* Allow first column to be taller for stamps */
  .day-table tbody td:first-child { height: auto; min-height: 38px; padding: 6px 8px; vertical-align: top; }

  /* ── Day filter bar ── */
  .day-filter-bar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 8px 16px; border-bottom: 1px solid var(--border);
    background: var(--bg2); flex-shrink: 0;
  }
  .dfb-search { flex: 1; min-width: 200px; position: relative; }
  .dfb-search::before { content: '🔍'; position: absolute; left: 9px; top: 50%; transform: translateY(-50%); font-size: 12px; pointer-events: none; }
  .dfb-inp {
    width: 100%; height: 32px; background: var(--bg3); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); padding: 0 10px 0 30px;
    font-size: 12px; outline: none; font-family: inherit;
  }
  .dfb-inp:focus { border-color: var(--red); }
  .dfb-sel {
    height: 32px; background: var(--bg3); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); padding: 0 8px;
    font-size: 12px; outline: none; cursor: pointer; font-family: inherit;
  }
  .dfb-sel:focus { border-color: var(--red); }
  .dfb-dates { display: flex; align-items: center; gap: 6px; }
  .dfb-date {
    height: 32px; background: var(--bg3); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); padding: 0 8px;
    font-size: 12px; outline: none; font-family: inherit; width: 130px;
  }
  .dfb-date:focus { border-color: var(--red); }
  .dfb-sep { font-size: 11px; color: var(--text3); }
  .dfb-btn {
    height: 32px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--border);
    font-size: 12px; cursor: pointer; font-family: inherit; font-weight: 600;
  }
  .dfb-btn-apply { background: var(--red); color: #fff; border-color: var(--red); }
  .dfb-btn-apply:hover { background: var(--red-dark); }
  .dfb-btn-clear  { background: var(--bg3); color: var(--text2); }
  .dfb-btn-clear:hover  { background: var(--bg4); }
  .dfb-count { font-size: 11px; color: var(--text3); white-space: nowrap; margin-left: auto; }

  /* ── Unassigned job pool panel ── */
  .day-upool {
    width: 248px; flex-shrink: 0; display: flex; flex-direction: column;
    border-left: 1px solid var(--border); background: var(--bg2);
    overflow: hidden; transition: width .2s ease;
  }
  .day-upool.day-upool-closed { width: 32px; }
  .day-upool-hdr {
    display: flex; align-items: center; gap: 6px; flex-shrink: 0;
    padding: 10px 10px 8px; border-bottom: 1px solid var(--border);
    background: var(--bg3);
  }
  .day-upool-title-txt {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .6px; color: var(--text2); flex: 1; white-space: nowrap;
    overflow: hidden;
  }
  .day-upool-cnt {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 18px; height: 18px; padding: 0 5px;
    background: var(--red); color: #fff; border-radius: 9px;
    font-size: 10px; font-weight: 700; flex-shrink: 0;
  }
  .day-upool-toggle {
    width: 22px; height: 22px; border: 1px solid var(--border); border-radius: 4px;
    background: var(--bg2); color: var(--text2); cursor: pointer; font-size: 14px;
    line-height: 1; padding: 0; font-family: inherit; flex-shrink: 0;
  }
  .day-upool-toggle:hover { background: var(--bg4); color: var(--red); }
  .day-upool-list { flex: 1; overflow-y: auto; padding: 6px; }
  .day-upool.day-upool-closed .day-upool-list,
  .day-upool.day-upool-closed .day-upool-title-txt,
  .day-upool.day-upool-closed .day-upool-cnt { display: none; }
  .day-upool-empty { font-size: 11px; color: var(--text3); text-align: center; padding: 24px 8px; }
  .day-upool-card {
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 10px 6px; margin-bottom: 6px; cursor: grab;
    transition: box-shadow .12s, border-color .12s;
  }
  .day-upool-card:hover { border-color: var(--red); box-shadow: 0 2px 8px rgba(0,0,0,.2); }
  .day-upool-card-dragging { opacity: .45; border-color: var(--red); }
  .day-upool-card-title { font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
  .day-upool-card-addr { font-size: 11px; color: var(--text2); margin-bottom: 2px; }
  .day-upool-card-meta { font-size: 11px; color: var(--text3); display: block; }
  .day-upool-card-meta.day-tel-link { color: var(--red); text-decoration: none; }
  .day-upool-card-meta.day-tel-link:hover { text-decoration: underline; }
  .day-upool-card-status { font-size: 10px; font-weight: 600; margin-top: 4px; display: inline-block; }
  .day-upool-card-drag { font-size: 10px; color: var(--text3); margin-top: 3px; }
  /* Drop target highlight on engineer group rows */
  .dgroup-droptarget > td { background: rgba(59,130,246,.18) !important; }
  .dgroup-drop-hint {
    display: none; font-size: 10px; color: var(--text3); margin-left: 8px; font-weight: 400;
  }
  .dgroup-droptarget .dgroup-drop-hint { display: inline; color: #3B82F6; }

  /* ── Status tab strip ── */
  .day-status-tabs {
    display: flex; align-items: center; gap: 2px; flex-shrink: 0;
    padding: 6px 12px; border-bottom: 1px solid var(--border);
    background: var(--bg); overflow-x: auto; scrollbar-width: none;
  }
  .day-status-tabs::-webkit-scrollbar { display: none; }
  .dst {
    display: inline-flex; align-items: center; gap: 2px; white-space: nowrap;
    padding: 4px 10px; border-radius: 20px; border: 1px solid transparent;
    font-size: 11px; font-weight: 500; cursor: pointer; transition: all .12s;
    background: transparent; color: var(--text2); font-family: inherit;
    flex-shrink: 0;
  }
  .dst:hover { background: var(--bg2); color: var(--text); border-color: var(--border); }
  .dst.dst-active { background: var(--red); color: #fff; border-color: var(--red); }
  .dst-badge {
    display: inline-block; min-width: 16px; padding: 0 4px;
    height: 16px; line-height: 16px; border-radius: 8px; text-align: center;
    font-size: 10px; font-weight: 700;
    background: rgba(255,255,255,0.2); color: inherit;
  }
  .dst:not(.dst-active) .dst-badge { background: var(--bg3); color: var(--text3); }

  /* ── Copy button on hoverable cells ── */
  .copy-cell { position: relative; }
  .copy-cell .copy-btn {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    width: 20px; height: 20px; border: 1px solid var(--border);
    background: var(--bg2); border-radius: 4px; cursor: pointer;
    font-size: 11px; color: var(--text2); display: none;
    place-items: center; padding: 0; line-height: 1;
  }
  .copy-cell:hover .copy-btn { display: grid; }
  .copy-cell .copy-btn:hover { background: var(--bg3); color: var(--red); border-color: var(--red); }
  .copy-cell .copy-btn.copied { color: #059669; border-color: #059669; }

  /* ── Inline amount editor ── */
  .amt-td .amt-edit-icon {
    display: none; margin-left: 4px; font-size: 10px;
    opacity: .5; color: var(--text3);
  }
  .amt-td:hover .amt-edit-icon { display: inline; }
  .amt-edit-wrap {
    display: inline-flex; align-items: center; gap: 2px;
    justify-content: flex-end;
  }
  .amt-prefix { font-size: 11px; color: var(--text3); }
  .amt-inp {
    width: 72px; height: 26px; background: var(--bg3); border: 1px solid var(--red);
    border-radius: 5px; color: var(--text); padding: 0 5px; font-size: 12px;
    font-weight: 600; text-align: right; outline: none; font-family: inherit;
    font-variant-numeric: tabular-nums;
  }
  /* hide browser spinner arrows on number input */
  .amt-inp::-webkit-outer-spin-button,
  .amt-inp::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .amt-inp[type=number] { -moz-appearance: textfield; }
  .amt-save-btn, .amt-cancel-btn {
    width: 22px; height: 22px; border-radius: 4px; border: 1px solid var(--border);
    background: var(--bg2); cursor: pointer; font-size: 12px; padding: 0;
    line-height: 1; color: var(--text2); font-family: inherit;
  }
  .amt-save-btn  { color: #059669; border-color: #059669; }
  .amt-save-btn:hover  { background: #059669; color: #fff; }
  .amt-cancel-btn:hover { background: var(--bg4); color: var(--red); border-color: var(--red); }

  /* ────────────────────────────────────────
     MONTH VIEW
  ──────────────────────────────────────── */
  #view-month .body { flex: 1; overflow-y: auto; }

  .month-grid {
    display: grid; grid-template-columns: repeat(7, 1fr);
    border-left: 1px solid var(--border); border-top: 1px solid var(--border);
  }
  .month-dow {
    background: var(--bg2); text-align: center; padding: 8px 4px;
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text3);
    border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 5;
  }
  .month-cell {
    border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
    padding: 6px; min-height: 100px; cursor: pointer; vertical-align: top;
    transition: background 0.1s;
  }
  .month-cell:hover { background: var(--bg3); }
  .month-cell.other-month { opacity: 0.35; }
  .month-num {
    font-size: 12px; font-weight: 700; width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%; margin-bottom: 4px;
  }
  .month-cell.today-cell .month-num { background: var(--red); color: #fff; }
  .month-job-row { display: flex; align-items: center; gap: 4px; margin-bottom: 2px; }
  .month-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .month-lbl { font-size: 10px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .month-more { font-size: 10px; color: var(--text3); padding: 1px 0; }

  /* ────────────────────────────────────────
     STATUS COLOURS
  ──────────────────────────────────────── */
  .status-pending            { border-left-color: #F59E0B; }
  .status-in_progress        { border-left-color: #3B82F6; }
  .status-engineer_completed { border-left-color: #8B5CF6; }
  .status-completed          { border-left-color: #22C55E; }
  .status-invoiced           { border-left-color: #14B8A6; }
  .status-paid, .status-closed { border-left-color: #16A34A; }
  .status-cannot_access      { border-left-color: #F97316; }
  .status-cancelled          { border-left-color: #6B7280; }
  .status-failed             { border-left-color: #EF4444; }

  .badge-pending             { background: rgba(245,158,11,0.18); color: #F59E0B; }
  .badge-in_progress         { background: rgba(59,130,246,0.18); color: #60a5fa; }
  .badge-engineer_completed  { background: rgba(139,92,246,0.18); color: #a78bfa; }
  .badge-completed           { background: rgba(34,197,94,0.18); color: #4ade80; }
  .badge-invoiced            { background: rgba(20,184,166,0.18); color: #2dd4bf; }
  .badge-cannot_access       { background: rgba(249,115,22,0.18); color: #fb923c; }
  .badge-cancelled           { background: rgba(107,114,128,0.18); color: #9ca3af; }
  .badge-failed              { background: rgba(239,68,68,0.18); color: #f87171; }
  .badge-closed, .badge-paid { background: rgba(22,163,74,0.18); color: #4ade80; }

  /* ────────────────────────────────────────
     ADD JOB OVERLAY
  ──────────────────────────────────────── */
  #view-add {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    align-items: center; justify-content: center; z-index: 200;
  }
  .add-box {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
    padding: 24px 28px; width: 430px; display: flex; flex-direction: column; gap: 14px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.3);
  }
  .add-ttl { font-size: 16px; font-weight: 800; }
  .fg { display: flex; flex-direction: column; gap: 4px; }
  .frow { display: flex; gap: 12px; }
  .frow .fg { flex: 1; }
  .add-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
  .btn-cancel {
    background: var(--bg3); border: 1px solid var(--border); color: var(--text2);
    border-radius: 6px; padding: 8px 18px; cursor: pointer; font-size: 13px;
  }
  .btn-cancel:hover { background: var(--bg4); }
  .btn-primary {
    background: var(--red); color: #fff; border: none; border-radius: 6px;
    padding: 8px 18px; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .btn-primary:hover { background: var(--red-dark); }
  .btn-primary:disabled { background: #777; cursor: not-allowed; }
  .err-msg { color: #f87171; font-size: 11px; display: none; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: var(--bg2); }
  ::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 3px; }

  /* ── QUOTATION BUILDER OVERLAY ── */
  #qb-overlay {
    display: none; position: fixed; inset: 0; z-index: 3000;
    background: rgba(0,0,0,0.8); align-items: center; justify-content: center;
  }
  #qb-overlay.qb-open { display: flex; }
  #qb-modal {
    background: var(--bg); width: 97vw; height: 94vh;
    border-radius: 12px; overflow: hidden;
    display: flex; flex-direction: column;
    box-shadow: 0 32px 96px rgba(0,0,0,0.7);
  }
  .qb-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 18px; background: var(--bg3); border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .qb-header h2 {
    font-size: 14px; font-weight: 700; color: var(--text); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; flex: 1;
  }
  #qb-close {
    background: none; border: 1px solid var(--border); color: var(--text2);
    cursor: pointer; font-size: 16px; padding: 3px 10px; border-radius: 5px; margin-left: 12px; flex-shrink: 0;
  }
  #qb-close:hover { color: var(--text); background: var(--bg4); }

  #qb-content {
    flex: 1; display: grid; grid-template-columns: 240px 260px 1fr;
    overflow: hidden; min-height: 0;
  }
  .qb-loading {
    grid-column: 1/-1; display: flex; align-items: center; justify-content: center;
    gap: 10px; color: var(--text3); font-size: 14px;
  }
  .qb-panel {
    overflow-y: auto; padding: 14px; border-right: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 6px; min-height: 0;
  }
  .qb-panel:last-child { border-right: none; }
  .qb-panel-title {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.4px; color: var(--text3); margin-bottom: 4px; flex-shrink: 0;
  }
  .qb-info-block {
    background: var(--bg3); border-radius: 6px; padding: 8px 10px;
    font-size: 11px; border: 1px solid var(--border); flex-shrink: 0;
  }
  .qb-info-row { color: var(--text2); padding: 1px 0; }
  .qb-info-row b { color: var(--text); }
  .qb-sub-title {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.4px; color: var(--text3); margin-top: 8px; flex-shrink: 0;
  }
  .qb-event {
    display: flex; gap: 6px; font-size: 10px; padding: 5px 6px;
    border-radius: 4px; background: var(--bg3); border: 1px solid transparent; flex-shrink: 0;
  }
  .qb-event:hover { border-color: var(--border); }
  .qb-ev-icon { flex-shrink: 0; }
  .qb-ev-body { flex: 1; min-width: 0; }
  .qb-ev-actor { font-weight: 700; color: var(--text); }
  .qb-ev-msg { color: var(--text2); word-break: break-word; margin-top: 1px; }
  .qb-ev-time { color: var(--text3); font-size: 9px; margin-top: 2px; }
  .qb-photo-sel-count { font-size: 11px; color: var(--text3); font-weight: 600; flex-shrink: 0; }
  .qb-photo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .qb-photo-item {
    position: relative; border-radius: 6px; overflow: hidden;
    border: 2px solid transparent; cursor: pointer; transition: border-color .15s; flex-shrink: 0;
  }
  .qb-photo-item:hover { border-color: var(--text3); }
  .qb-photo-item.qb-photo-selected { border-color: #2563eb; }
  .qb-photo-sel-tick {
    position: absolute; top: 4px; right: 4px; width: 20px; height: 20px;
    border-radius: 50%; background: rgba(0,0,0,.55); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; opacity: 0; transition: opacity .15s; z-index: 1;
  }
  .qb-photo-item.qb-photo-selected .qb-photo-sel-tick { opacity: 1; background: #2563eb; }
  .qb-photo-item img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
  .qb-photo-doc { padding: 14px 8px; font-size: 10px; color: var(--text2); background: var(--bg3); text-align: center; }
  .qb-photo-lbl { font-size: 9px; color: var(--text3); text-align: center; padding: 2px 4px; background: var(--bg3); }
  .qb-photo-ref-badge {
    position: absolute; top: 4px; left: 4px;
    background: #E1251B; color: #fff;
    font-size: 9px; font-weight: 800; padding: 2px 5px; border-radius: 3px;
    z-index: 2; line-height: 1.2; pointer-events: none; letter-spacing: 0.2px;
  }
  .qb-photo-item.qb-photo-tagged { border-color: #E1251B !important; }
  .qb-photo-tag-hint {
    font-size: 10px; color: #E1251B; font-weight: 600; padding: 5px 8px;
    background: rgba(225,37,27,.07); border: 1px dashed rgba(225,37,27,.35);
    border-radius: 5px; margin-bottom: 6px; flex-shrink: 0;
    text-align: center; display: none;
  }
  .qb-photo-tag-hint.visible { display: block; }
  .qb-line-desc.qb-tag-target {
    border-color: #E1251B !important;
    box-shadow: 0 0 0 2px rgba(225,37,27,.15);
  }
  .qb-empty { font-size: 12px; color: var(--text3); text-align: center; padding: 28px 12px; }
  .qb-editor { background: var(--bg2); }
  .qb-quote-meta {
    font-size: 11px; color: var(--text2); background: var(--bg3);
    padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border);
    line-height: 1.7; margin-bottom: 6px; flex-shrink: 0;
  }
  .qb-quote-meta b { color: var(--text); }
  .qb-field-label {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.4px; color: var(--text3); flex-shrink: 0;
  }
  .qb-textarea {
    width: 100%; padding: 7px 9px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg3); color: var(--text); font-size: 12px; font-family: inherit;
    resize: vertical; flex-shrink: 0;
  }
  .qb-textarea:focus { outline: none; border-color: #2563eb; }
  .qb-line-row {
    background: var(--bg3); border: 1px solid var(--border); border-radius: 6px;
    padding: 8px; flex-shrink: 0;
  }
  .qb-line-desc-wrap { position: relative; }
  .qb-line-desc {
    width: 100%; padding: 6px 68px 6px 8px; border: 1px solid var(--border); border-radius: 5px;
    background: var(--bg); color: var(--text); font-size: 12px; font-family: inherit; resize: vertical;
  }
  .qb-line-desc:focus { outline: none; border-color: #2563eb; }
  .qb-line-desc { padding: 6px 68px 28px 8px !important; }
  .qb-ai-btn {
    position: absolute; top: 4px; right: 4px; padding: 3px 7px;
    border: 1px solid rgba(139,92,246,.4); border-radius: 4px;
    background: rgba(139,92,246,.1); color: #7c3aed;
    font-size: 10px; font-weight: 700; cursor: pointer;
  }
  .qb-ai-btn:hover { background: rgba(139,92,246,.2); }
  .qb-ai-btn:disabled { opacity: 0.5; cursor: default; }
  .qb-tag-ref-btn {
    position: absolute; bottom: 4px; right: 4px; padding: 3px 7px;
    border: 1px solid rgba(225,37,27,.35); border-radius: 4px;
    background: rgba(225,37,27,.07); color: #E1251B;
    font-size: 10px; font-weight: 700; cursor: pointer;
  }
  .qb-tag-ref-btn:hover { background: rgba(225,37,27,.18); }
  .qb-line-nums {
    display: flex; align-items: center; gap: 5px; margin-top: 5px; font-size: 11px; flex-wrap: wrap;
  }
  .qb-line-qty, .qb-line-price {
    width: 62px; padding: 4px 6px; border: 1px solid var(--border); border-radius: 4px;
    background: var(--bg); color: var(--text); font-size: 11px; font-family: inherit;
  }
  .qb-line-qty::-webkit-outer-spin-button,
  .qb-line-qty::-webkit-inner-spin-button,
  .qb-line-price::-webkit-outer-spin-button,
  .qb-line-price::-webkit-inner-spin-button { -webkit-appearance: none; }
  .qb-line-x, .qb-line-sym { color: var(--text3); }
